site_name: Docs Portal
site_description: Documentation for the Unicity Protocol, AgentSphere, and Unicity AOS.
site_url: https://unicitynetwork.github.io/unicity-docs/
repo_url: https://github.com/unicitynetwork/unicity-docs
repo_name: unicitynetwork/unicity-docs
copyright: Unicity Labs

theme:
  name: material
  logo: assets/logo.svg
  font:
    text: Geist
    code: Geist Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji

# CI runs `mkdocs build --strict`, so any WARNING fails the build.
# nav.not_found stays at WARNING: if an upstream repo removes or renames a file
# we import, CI goes red instead of silently publishing dead nav links (404s).
# Link/anchor issues inside imported READMEs are demoted to INFO: they point at
# source files in their own repos, are not fixable from here, and must not block
# deploys. They remain visible in the build log.
validation:
  nav:
    omitted_files: ignore
    not_found: warn
  links:
    not_found: info
    anchors: info

# Rewrites relative links in imported READMEs (source files, .env.example, test
# fixtures) to absolute GitHub URLs so they resolve instead of 404ing.
hooks:
  - hooks/github_links.py

plugins:
  - search
  - multirepo:
      cleanup: true
      keep_docs_dir: true
      nav_repos:
        - name: stsdk
          import_url: https://github.com/unicitynetwork/state-transition-sdk-js?branch=main
          imports:
            - /README.md
            - /unicity-token-protocol-spec.md
        - name: sphere
          import_url: https://github.com/unicity-sphere/sphere-sdk?branch=main
          imports:
            - /README.md
            - docs/QUICKSTART-NODEJS.md
            - docs/QUICKSTART-BROWSER.md
            - docs/QUICKSTART-CLI.md
            - docs/INTEGRATION.md
            - docs/API.md
            - docs/CONNECT.md
            - docs/NAMETAG-BINDINGS.md
        - name: aos
          import_url: https://github.com/unicity-aos/aos-ce?branch=main
          imports:
            - /README.md
            - docs/release-channels.md
            - docs/runtime-migration.md

nav:
  - Home: index.md
  - Unicity Protocol:
      - Overview: protocol/index.md
      - Research Papers: protocol/research-papers.md
      - State Transition SDK (JS):
          - Overview: stsdk/README.md
          - Token Protocol Spec: stsdk/unicity-token-protocol-spec.md
  - AgentSphere:
      - Sphere SDK:
          - Overview: sphere/README.md
          - Quickstart (Node.js): sphere/docs/QUICKSTART-NODEJS.md
          - Quickstart (Browser): sphere/docs/QUICKSTART-BROWSER.md
          - Quickstart (CLI): sphere/docs/QUICKSTART-CLI.md
          - Integration Guide: sphere/docs/INTEGRATION.md
          - API Reference: sphere/docs/API.md
          - Connect (dApp / Wallet): sphere/docs/CONNECT.md
          - Nametag Bindings: sphere/docs/NAMETAG-BINDINGS.md
  - Unicity AOS:
      - Overview: agentstack/astrid.md
      - README: aos/README.md
      - Release Channels: aos/docs/release-channels.md
      - Runtime Migration: aos/docs/runtime-migration.md
      - Repositories:
          - AOS Community Edition: https://github.com/unicity-aos/aos-ce
          - Capsule Authoring: https://github.com/unicity-aos/capsule-forge
          - All AOS Repositories: https://github.com/unicity-aos
